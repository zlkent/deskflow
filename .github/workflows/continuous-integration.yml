# macOS source validation for the Pinyin input-source candidate.
name: macOS input-source validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_SHA: ${{ github.sha }}
  PACKAGE_PREFIX: deskflow
  CMAKE_CONFIGURE: cmake -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_BUILD_TESTS=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14

jobs:
  macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: sithlord48/fancy-checkout@v2

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.11.1
          vcpkg-triplet: arm64-osx-release

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Configure
        run: ${{ env.CMAKE_CONFIGURE }} ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DPACKAGE_VERSION_LABEL="${{ env.DESKFLOW_PACKAGE_VERSION }}"

      - name: Build
        run: cmake --build build --config Release -j8

      - name: Package
        shell: bash
        run: |
          for i in $(seq 1 5); do
            cmake --build build --config Release -j8 --target package && exit 0
            sleep 1
          done
          exit 1

      - name: Upload macOS ARM64 candidate
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-macos-arm64-input-source-candidate
          path: build/deskflow-*
          if-no-files-found: error
